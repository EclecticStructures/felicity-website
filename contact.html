<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Felicity Contract Furnishings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="nav" id="nav" data-hero="dark">
        <a href="index.html" class="nav-logo">Felicity</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="brands.html">Brands</a></li>
            <li class="nav-divider"></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <!-- HERO -->
    <section class="contact-hero">
        <div class="contact-hero-content">
            <p class="contact-hero-tagline">One continuous<br>partnership.</p>
        </div>
    </section>

    <!-- CONTACT SECTION -->
    <section class="contact-section textured">

        <div class="contact-info fade-in">
            <p class="contact-info-name">Shelley<br>Straughan</p>
            <p class="contact-info-title">Felicity Contract Furnishings</p>
            <div class="contact-info-details">
                <a href="mailto:shelley@felicitycontract.com">shelley@felicitycontract.com</a>
                <a href="tel:4178619108">417.861.9108</a>
            </div>
            <p class="contact-info-territory">Louisiana &nbsp;·&nbsp; Mississippi &nbsp;·&nbsp; Tennessee</p>
        </div>

        <form class="contact-form fade-in" name="contact" method="POST" data-netlify="true">
            <input type="hidden" name="form-name" value="contact">
            <div class="form-group">
                <input type="text" name="name" placeholder="Name" required>
            </div>
            <div class="form-group">
                <input type="text" name="company" placeholder="Company">
            </div>
            <div class="form-group">
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="tel" name="phone" placeholder="Phone">
            </div>
            <div class="form-group">
                <textarea name="message" placeholder="How can Shelley help?" rows="5"></textarea>
            </div>
            <button type="submit" class="form-submit">Send</button>
        </form>

    </section>

    <footer class="site-footer">
        <div class="site-footer-rule" aria-hidden="true"></div>
        <span class="site-footer-wordmark">Felicity</span>
        <p class="site-footer-copy">&copy; 2025 Felicity Contract Furnishings</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
